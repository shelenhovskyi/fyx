<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Fyx concept A, "tree F": an F drawn as a flat UI tree (a stem with two branches ending in
       nodes), for a flat node tree with parent ids. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A1F"/>
      <stop offset="1" stop-color="#F0452E"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <g fill="#FFFFFF">
    <rect x="300" y="250" width="130" height="524" rx="36"/>
    <rect x="300" y="250" width="290" height="130" rx="36"/>
    <rect x="640" y="250" width="130" height="130" rx="36"/>
    <rect x="300" y="452" width="190" height="130" rx="36"/>
    <rect x="540" y="452" width="130" height="130" rx="36"/>
  </g>
</svg>
