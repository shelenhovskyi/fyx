<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Fyx concept B, "fix mark": a check whose long stroke crosses a second stroke, so it reads as
       both the x of Fyx and an approved change, for agent review. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16213A"/>
      <stop offset="1" stop-color="#0B1222"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2EE6A6"/>
      <stop offset="1" stop-color="#22C7F0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="128">
    <path d="M 318 318 L 706 706" stroke="#FFFFFF"/>
    <path d="M 286 566 L 440 720 L 738 302" stroke="#0B1222" stroke-width="200"/>
    <path d="M 286 566 L 440 720 L 738 302" stroke="url(#mark)"/>
  </g>
</svg>
