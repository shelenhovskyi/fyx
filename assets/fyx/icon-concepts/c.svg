<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Fyx concept C, "slot": three fixed tiles and one tile plugged in from outside the grid, for
       an editor whose panels come from extensions. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B5CFF"/>
      <stop offset="1" stop-color="#4B2FD0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <g fill="#FFFFFF">
    <rect x="262" y="262" width="220" height="220" rx="52"/>
    <rect x="262" y="542" width="220" height="220" rx="52"/>
    <rect x="542" y="542" width="220" height="220" rx="52"/>
  </g>
  <rect x="562" y="262" width="220" height="220" rx="52" fill="#FFD23F"
        transform="translate(36 -36) rotate(14 672 372)"/>
</svg>
