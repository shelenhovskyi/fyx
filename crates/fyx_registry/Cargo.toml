[package]
name = "fyx_registry"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "Fyx extension registry core: index and block list formats, Ed25519 signatures, age gate and update planning"

[lints]
workspace = true

[lib]
path = "src/fyx_registry.rs"
doctest = false

[[bin]]
name = "fyx-registry"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
hex.workspace = true
ring.workspace = true
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ui_ext = { workspace = true, features = ["network"] }
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
