# Guest fixture for ui_ext_host: a status-bar item, which no demo has. Built for wasm32-wasip2 by
# the ui_ext_host tests themselves; for the running editor, build it and copy the component next to
# extension.toml as fyx_ui.wasm (see tasks/progress/W3.md).
# Not a workspace member: it has its own `[workspace]` and lockfile.
[package]
name = "fyx_ui_test_status_item"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
path = "src/status_item.rs"
crate-type = ["cdylib"]

[dependencies]
ui_ext_sdk = { path = "../../../ui_ext_sdk" }

[workspace]

[profile.release]
opt-level = "s"
debug = false
strip = true
