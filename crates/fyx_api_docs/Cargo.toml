[package]
name = "fyx_api_docs"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "Generates the Fyx extension API reference (WIT world, guest SDK, test harness) and checks it for drift"

[lints]
workspace = true

[lib]
path = "src/fyx_api_docs.rs"
doctest = false

[[bin]]
name = "fyx-api-docs"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
syn = { workspace = true, features = ["full", "parsing"] }
# Already in Cargo.lock through wit-component.
wit-parser = "0.254"
