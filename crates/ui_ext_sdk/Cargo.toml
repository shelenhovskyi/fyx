[package]
name = "ui_ext_sdk"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "Guest SDK for writing Fyx UI extensions in Rust"

[lints]
workspace = true

[lib]
path = "src/ui_ext_sdk.rs"
test = true
doctest = false

[features]
# The SDK's world: fyx:ui 0.2 without it, the staged 0.3 with it. Only a 0.3 build may link the
# 0.3 world description, so a 0.1 or 0.2 component imports nothing of 0.3.
fyx-ui-0-3 = ["dep:ui_ext_sdk_v0_2"]
# The staged fyx:ui 0.4 (terminals, plan P5) instead of 0.3. A 0.4 build exports 0.4, 0.2 or 0.1;
# an extension that also ships as 0.3 builds that copy without this feature.
fyx-ui-0-4 = ["fyx-ui-0-3"]

[dependencies]
ui_ext.workspace = true
ui_ext_sdk_v0_1.workspace = true
ui_ext_sdk_v0_2 = { workspace = true, optional = true }
wit-bindgen = "0.41"
