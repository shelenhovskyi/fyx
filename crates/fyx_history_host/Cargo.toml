[package]
name = "fyx_history_host"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
description = "Fyx local history in the app (plan 6.3): snapshots on save and per agent turn, the fyx.history settings and the Local History modal, on top of fyx_history"

[lints]
workspace = true

[lib]
path = "src/fyx_history_host.rs"
doctest = false

[dependencies]
agent_review.workspace = true
anyhow.workspace = true
fyx_history.workspace = true
gpui.workspace = true
language.workspace = true
log.workspace = true
paths.workspace = true
project.workspace = true
settings.workspace = true
ui.workspace = true
workspace.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
