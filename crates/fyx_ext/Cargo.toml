[package]
name = "fyx_ext"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "fyx-ext: create, build, check, run and package Fyx UI extensions"

[lints]
workspace = true

[lib]
path = "src/fyx_ext.rs"
doctest = false

[[bin]]
name = "fyx-ext"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async_zip.workspace = true
clap.workspace = true
futures.workspace = true
fyx_ext_harness.workspace = true
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
smol.workspace = true
toml.workspace = true
ui_ext.workspace = true
walkdir.workspace = true
wasmparser.workspace = true

[dev-dependencies]
tempfile.workspace = true
