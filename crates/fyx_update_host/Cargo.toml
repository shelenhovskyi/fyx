[package]
name = "fyx_update_host"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
description = "Fyx self-update in the app (plan 6.2): the opt-in setting, \"fyx: check for updates\" and the update notification, on top of fyx_update"

