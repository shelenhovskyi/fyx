[package]
name = "ui_ext"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "Fyx UI extension contract: the fyx:ui WIT world and the host-side tree model"

[lints]
workspace = true

[lib]
path = "src/ui_ext.rs"
doctest = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
# Only with the `network` feature: the host and the harness need it, guests do not.
url = { workspace = true, optional = true }

[features]
# `ui_ext::network` and `ui_ext::process`: the pure parts of the fyx:ui 0.3 T2 imports
# (`network:fetch`, `process:spawn`): limits, types, the manifest rules and the import checks,
# shared by `ui_ext_wasm`, `fyx_ext_harness` and `fyx_registry`. Guests do not need them.
t2 = ["dep:url"]
network = ["t2"]
process = ["t2"]
edit = ["t2"]
observe = ["t2"]

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
