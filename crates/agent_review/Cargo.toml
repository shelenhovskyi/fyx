[package]
name = "agent_review"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
description = "Host-owned model of agent-proposed edits with hunk-by-hunk accept and reject"

[lints]
workspace = true

[lib]
path = "src/agent_review.rs"
doctest = false

[features]
# dev-only: compiles the review script driver (`FYX_AGENT_REVIEW_SCRIPT`) into release builds.
review-script = []

[dependencies]
acp_thread.workspace = true
action_log.workspace = true
agent-client-protocol.workspace = true
anyhow.workspace = true
buffer_diff.workspace = true
editor.workspace = true
fs.workspace = true
futures.workspace = true
fyx_guard.workspace = true
globset.workspace = true
gpui.workspace = true
language.workspace = true
log.workspace = true
paths.workspace = true
project.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
toml.workspace = true
ui.workspace = true
workspace.workspace = true

[dev-dependencies]
acp_thread = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
language = { workspace = true, features = ["test-support"] }
editor = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
theme.workspace = true
theme_settings.workspace = true
util = { workspace = true, features = ["test-support"] }
uuid.workspace = true
workspace = { workspace = true, features = ["test-support"] }
