[package]
name = "terminal_host"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
description = "Fyx terminal UI on top of terminal_ext: tab status, agent sessions, extension terminals"

[lints]
workspace = true

[lib]
path = "src/terminal_host.rs"
doctest = false

[dependencies]
acp_thread.workspace = true
futures.workspace = true
fyx_relay.workspace = true
gpui.workspace = true
ui_ext = { workspace = true, features = ["t2"] }
log.workspace = true
project.workspace = true
release_channel.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
sysinfo.workspace = true
task.workspace = true
terminal.workspace = true
terminal_ext.workspace = true
terminal_view.workspace = true
theme_settings.workspace = true
ui.workspace = true
util.workspace = true
workspace.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Security_Authorization"] }

[dev-dependencies]
editor = { workspace = true, features = ["test-support"] }
fs = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
terminal = { workspace = true, features = ["test-support"] }
terminal_view = { workspace = true, features = ["test-support"] }
workspace = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
