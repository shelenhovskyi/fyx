[package]
name = "fyx_relay"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
description = "fyx-relay: command hooks of CLI tools reach a running Fyx over a loopback endpoint (design 0.4 B.9)"

[lints]
workspace = true

[lib]
path = "src/fyx_relay.rs"
doctest = false

[[bin]]
name = "fyx-relay"
path = "src/main.rs"

[dependencies]
dirs.workspace = true
log.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
