# Guest components for the fyx:ui host tests, built for wasm32-wasip2 by the tests themselves
# (`ui_ext_wasm::test_support`). Not part of Fyx's workspace: one workspace and one lockfile of
# their own, shared by `ui_ext_wasm`'s and `ui_ext_host`'s tests.
[workspace]
members = ["probe", "probe_v0_2", "probe_v0_3", "probe_v0_4", "status_item"]
resolver = "3"

[profile.release]
opt-level = "s"
debug = false
strip = true
