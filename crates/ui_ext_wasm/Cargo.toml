[package]
name = "ui_ext_wasm"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
description = "Runs fyx:ui extension components in wasmtime: bindings, call queue, time budget, manifest"

[lints]
workspace = true

[lib]
path = "src/ui_ext_wasm.rs"
doctest = false

[features]
test-support = []

[dependencies]
anyhow.workspace = true
async-compression.workspace = true
bytes.workspace = true
fs.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_tokio.workspace = true
http_proxy.workspace = true
log.workspace = true
release_channel.workspace = true
moka.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process", "time"] }
toml = { workspace = true, features = ["display"] }
ui_ext = { workspace = true, features = ["network", "process"] }
url.workspace = true
wasmparser.workspace = true
wasmtime-wasi.workspace = true
wasmtime.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
fyx_ext_harness.workspace = true
fs = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }
