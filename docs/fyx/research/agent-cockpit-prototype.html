<title>Fyx Agent Cockpit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* v2 layout: a calm Fyx window (Zed One Dark). Title bar holds one attention pill. Center = editor / agent card / merge queue.
   Bottom = terminal + Agent Sessions (needs-you first, done collapsed). Right = coordinator chat (coordinator words only). */
:root {
  color-scheme: dark;
  --desk: #16181d;
  --bg: #282c33;
  --panel: #2f343e;
  --elevated: #3b414d;
  --border: #3d424d;
  --border-strong: #464b57;
  --fg: #dce0e5;
  --muted: #a9afbc;
  --dim: #7a808d;
  --accent: #74ade8;
  --ok: #a1c181;
  --warn: #dec184;
  --bad: #d07277;
  --violet: #b477cf;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace;
}
html, body { height: 100%; }
body {
  background: var(--desk); color: var(--fg); font: 13px/1.45 var(--sans);
  display: flex; flex-direction: column; gap: 10px; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }

/* prototype controls (not part of the product) */
.proto { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.proto strong { color: var(--fg); font-weight: 600; letter-spacing: .04em; font-size: 11px; }
.pbtn { background: transparent; border: 1px dashed var(--dim); border-radius: 4px; padding: 3px 10px; }
.pbtn:hover { border-color: var(--accent); }
.pbtn.on { border-style: solid; border-color: var(--warn); color: var(--warn); }
.proto .hint { flex: 1 1 260px; min-width: 0; }
.ver { border: 1px solid var(--border-strong); border-radius: 10px; padding: 0 8px; font-size: 11px; }

.win { flex: 1; min-height: 0; display: grid; grid-template-rows: 34px 1fr; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; background: var(--bg); }
.titlebar { display: flex; align-items: center; gap: 12px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--border); white-space: nowrap; overflow-x: auto; }
.tb-proj { font-weight: 600; } .tb-branch { color: var(--dim); }
.tb-sp { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 12px; padding: 2px 10px; border: 1px solid var(--border-strong); background: transparent; color: var(--muted); font-size: 12px; }
.pill.hot { background: var(--warn); border-color: var(--warn); color: #1b1d22; font-weight: 600; }
.pill.hot:hover { filter: brightness(1.08); }

.body { display: grid; grid-template-columns: minmax(0,1fr) 330px; min-height: 0; }
.main { display: grid; grid-template-rows: minmax(0,1fr) minmax(220px, 44%); min-height: 0; border-right: 1px solid var(--border); }
.center { display: grid; grid-template-rows: 30px 1fr; min-height: 0; }
.tabs { display: flex; background: var(--panel); border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab { border: 0; border-right: 1px solid var(--border); background: transparent; padding: 0 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.tab.active { background: var(--bg); color: var(--fg); }
.tab .x { opacity: .5; padding: 0 2px; } .tab .x:hover { opacity: 1; }
.pane { overflow: auto; min-height: 0; }
.code { font: 12.5px/1.6 var(--mono); padding: 10px 0; }
.code div { padding: 0 14px; white-space: pre; }
.code .ln { display: inline-block; width: 34px; color: var(--dim); text-align: right; margin-right: 14px; user-select: none; }
.k { color: var(--violet); } .t { color: var(--warn); } .f { color: var(--accent); } .c { color: var(--dim); }

/* status dots: color + shape so state reads without color too */
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.d-attn { background: var(--warn); }
.d-work { background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
.d-merge { background: transparent; border: 2px solid var(--violet); }
.d-done { background: var(--ok); opacity: .7; }
.d-off { background: transparent; border: 1.5px solid var(--dim); }
.d-ext { background: transparent; border: 1.5px dashed var(--dim); }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .d-work { animation: none; } }

/* card */
.card { padding: 18px 22px 28px; display: grid; gap: 16px; max-width: 820px; }
.card h2 { margin: 0; font-size: 17px; font-weight: 600; text-wrap: balance; }
.status { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.status b { color: var(--fg); font-weight: 500; }
.ask { border: 1px solid var(--warn); border-radius: 8px; padding: 12px 14px; display: grid; gap: 10px; background: rgba(222,193,132,.06); }
.ask .q { font-size: 14px; }
.opts { display: grid; gap: 6px; }
.opts button { text-align: left; border: 1px solid var(--border-strong); background: var(--elevated); border-radius: 6px; padding: 7px 11px; }
.opts button:hover { border-color: var(--accent); }
.opts button.rec { border-color: var(--warn); }
.opts small { color: var(--warn); margin-left: 8px; font-size: 11px; }
.ask .note { color: var(--dim); font-size: 12px; }
.primary-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--border-strong); background: var(--elevated); border-radius: 6px; padding: 6px 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1b1d22; font-weight: 600; }
.btn.quiet { background: transparent; border-color: transparent; color: var(--muted); }
.btn.quiet:hover { color: var(--fg); border-color: var(--border-strong); }
.btn.danger:hover { color: var(--bad); border-color: var(--bad); }
.doing { display: grid; gap: 4px; }
.doing .now { font-size: 13.5px; }
.prog { height: 4px; background: var(--elevated); border-radius: 2px; overflow: hidden; max-width: 260px; }
.prog i { display: block; height: 100%; background: var(--accent); }
details { border-top: 1px solid var(--border); padding-top: 10px; }
summary { cursor: pointer; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 6px; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "›"; display: inline-block; width: 10px; transition: transform .15s; }
details[open] > summary::before { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) { summary::before { transition: none; } }
.dbody { padding: 10px 0 0 16px; display: grid; gap: 10px; }
.kv { display: grid; grid-template-columns: max-content minmax(0,1fr); gap: 4px 16px; font-size: 12.5px; }
.kv dt { color: var(--dim); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.steps-l { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; color: var(--muted); }
.steps-l .on { color: var(--fg); } .steps-l .ok { color: var(--dim); text-decoration: line-through; text-decoration-color: var(--border-strong); }
.hunk { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.hunk-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--panel); padding: 5px 10px; font: 12px var(--mono); color: var(--muted); }
.hunk-h button { font: 12px var(--sans); background: transparent; border: 1px solid var(--border-strong); border-radius: 4px; padding: 1px 8px; color: var(--muted); }
.hunk-h button:hover { color: var(--fg); }
.hunk pre { margin: 0; font: 12px/1.55 var(--mono); overflow-x: auto; padding: 6px 0; }
.hunk pre span { display: block; padding: 0 10px; white-space: pre; }
.add { background: rgba(161,193,129,.11); color: #c5dcb0; } .del { background: rgba(208,114,119,.11); color: #e8a9ad; } .conf { background: rgba(222,193,132,.11); color: var(--warn); }
.comment { display: grid; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--border); }
textarea { width: 100%; resize: vertical; background: var(--bg); color: var(--fg); border: 1px solid var(--border-strong); border-radius: 5px; padding: 6px 8px; font: inherit; }
.sent-c { padding: 6px 10px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }

/* bottom panel */
.bottom { display: grid; grid-template-columns: minmax(0,1fr) minmax(300px, 400px); min-height: 0; border-top: 1px solid var(--border); }
.term { display: grid; grid-template-rows: 28px 1fr; min-height: 0; border-right: 1px solid var(--border); }
.ptitle { display: flex; align-items: center; gap: 10px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; }
.ptitle b { color: var(--fg); font-weight: 500; }
.ptitle .end { margin-left: auto; }
.termlog { font: 12px/1.55 var(--mono); padding: 6px 10px; overflow: auto; color: var(--muted); }
.termlog .ok { color: var(--ok); } .termlog .bad { color: var(--bad); } .termlog .me { color: var(--fg); }
.stoplink { border: 0; background: transparent; color: var(--dim); font-size: 12px; padding: 2px 4px; border-radius: 4px; }
.stoplink:hover { color: var(--bad); background: rgba(208,114,119,.1); }
.stopconfirm { display: flex; gap: 6px; align-items: center; color: var(--fg); font-size: 12px; }
.stopconfirm button { border-radius: 4px; padding: 1px 8px; border: 1px solid var(--border-strong); background: var(--elevated); font-size: 12px; }
.stopconfirm .danger { background: var(--bad); color: #1b1d22; border-color: var(--bad); font-weight: 600; }

.tree { display: grid; grid-template-rows: 28px 1fr 28px; min-height: 0; }
.rows { overflow: auto; padding: 4px 0 8px; }
.sec { padding: 10px 12px 3px; font-size: 11px; color: var(--dim); display: flex; gap: 6px; align-items: center; }
.sec.attn { color: var(--warn); }
.sec button { border: 0; background: transparent; color: inherit; padding: 0; font-size: 11px; }
.row { display: grid; grid-template-columns: 14px minmax(0,1fr) auto; align-items: center; gap: 8px; padding: 5px 12px; cursor: pointer; }
.row:hover { background: var(--panel); }
.row.sel { background: var(--elevated); }
.row .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .why { display: block; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.attn .why { color: var(--warn); }
.row .rt { color: var(--dim); font-size: 11.5px; white-space: nowrap; }
.row.attn .rt { color: var(--fg); font-weight: 500; }
.row.child { padding-left: 30px; }
.row.grand { padding-left: 48px; }
.morelink { border: 0; background: transparent; color: var(--dim); font-size: 11.5px; padding: 2px 12px 2px 52px; text-align: left; width: 100%; }
.morelink:hover { color: var(--fg); }
.quiet-empty { padding: 10px 12px; color: var(--dim); font-size: 12px; }
.treefoot { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-top: 1px solid var(--border); background: var(--panel); font-size: 11.5px; color: var(--dim); white-space: nowrap; overflow: hidden; }
.treefoot .warn { color: var(--warn); }

/* chat */
.chat { display: grid; grid-template-rows: 30px 1fr auto; min-height: 0; }
.msgs { overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.msg .who { font-size: 11px; color: var(--dim); margin-bottom: 2px; }
.msg .txt { background: var(--panel); border-radius: 8px; padding: 8px 10px; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; max-width: 88%; }
.msg.me .txt { background: rgba(116,173,232,.14); }
.msg.ref .txt { background: transparent; border: 1px solid var(--warn); }
.linkish { color: var(--accent); background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
.digest { border: 1px solid var(--accent); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; background: rgba(116,173,232,.06); }
.digest ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
.digest .sub { color: var(--dim); font-size: 12px; }
.composer { border-top: 1px solid var(--border); padding: 8px; display: grid; gap: 6px; }
.composer textarea { min-height: 52px; resize: none; background: var(--panel); border-color: var(--border); }
.composer .row2 { display: flex; justify-content: space-between; align-items: center; color: var(--dim); font-size: 11px; gap: 8px; }

/* one toast at a time */
.toasts { position: fixed; right: max(24px, env(safe-area-inset-right, 0px)); bottom: max(24px, env(safe-area-inset-bottom, 0px)); z-index: 30; width: min(320px, calc(100% - 48px)); }
.toast { background: var(--elevated); border: 1px solid var(--warn); border-radius: 8px; padding: 10px 12px; box-shadow: 0 10px 24px rgba(0,0,0,.5); display: grid; gap: 6px; }
.toast .tt { font-weight: 600; } .toast .tb { color: var(--muted); font-size: 12px; }
.toast .act { display: flex; gap: 8px; align-items: center; }
.toast .more { color: var(--dim); font-size: 11.5px; margin-left: auto; }

/* merge queue view */
.queue { padding: 18px 22px; display: grid; gap: 12px; max-width: 820px; }
.qitem { border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; display: grid; gap: 6px; }
.qitem .top { display: flex; gap: 8px; align-items: center; }
.qitem .sub { color: var(--muted); font-size: 12px; }
.qsteps { display: flex; gap: 4px; }
.qsteps i { height: 4px; flex: 1; border-radius: 2px; background: var(--elevated); }
.qsteps i.ok { background: var(--ok); } .qsteps i.on { background: var(--violet); } .qsteps i.bad { background: var(--warn); }

@media (max-width: 900px) {
  html, body { height: auto; }
  .win { grid-template-rows: auto auto; }
  .titlebar { padding: 6px 10px; }
  .body { grid-template-columns: 1fr; }
  .main { grid-template-rows: auto auto; border-right: 0; }
  .center { grid-template-rows: 30px minmax(320px, auto); }
  .bottom { grid-template-columns: 1fr; }
  .term { min-height: 160px; border-right: 0; border-bottom: 1px solid var(--border); }
  .tree { min-height: 340px; }
  .chat { min-height: 460px; border-top: 1px solid var(--border); }
}
</style>

<div class="proto" role="region" aria-label="Prototype controls">
  <strong>PROTOTYPE</strong><span class="ver">v2 · calmer</span>
  <button class="pbtn" id="p-play">▶ Play events</button>
  <button class="pbtn" id="p-step">Next event</button>
  <button class="pbtn" id="p-away">Simulate: I'm away</button>
  <button class="pbtn" id="p-reset">Reset</button>
  <span class="hint" id="p-hint">Fake data. Press Play, then follow the yellow pill in the title bar.</span>
</div>

<div class="win">
  <div class="titlebar" id="titlebar"></div>
  <div class="body">
    <div class="main">
      <div class="center">
        <div class="tabs" id="tabs"></div>
        <div class="pane" id="pane"></div>
      </div>
      <div class="bottom">
        <div class="term">
          <div class="ptitle"><b>Terminal</b><span>Fyx host log</span></div>
          <div class="termlog" id="termlog" aria-live="off"></div>
        </div>
        <div class="tree">
          <div class="ptitle"><b>Agent Sessions</b><span class="end" id="stopbox"></span></div>
          <div class="rows" id="rows"></div>
          <div class="treefoot" id="treefoot"></div>
        </div>
      </div>
    </div>
    <div class="chat">
      <div class="ptitle"><b>Coordinator</b><span>Claude Code</span></div>
      <div class="msgs" id="msgs"></div>
      <div class="composer">
        <textarea id="goal" aria-label="Message the coordinator" placeholder="Give the coordinator a goal…"></textarea>
        <div class="row2"><span>Enter to send</span><button class="btn primary" id="send">Send</button></div>
      </div>
    </div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

    var dot = a.budget ? "d-attn" : DOT[g(a)];
    return '<div class="row ' + (cls || "") + (attn ? " attn" : "") + (S.sel === a.id ? " sel" : "") + '" data-act="row" data-id="' + a.id + '" tabindex="0" role="button">' +
      '<span class="dot ' + dot + '"></span><span class="nm">' + h(a.title) + (why ? '<span class="why">' + h(why) + "</span>" : "") + '</span><span class="rt num">' + h(rt) + "</span></div>";
  }

  function renderTree() {
    var html = "", att = attention();
    if (att.length) html += '<div class="sec attn">Needs you</div>' + att.map(function (a) { return row(a); }).join("");
    var c = A("c1");
    var kids = S.agents.filter(function (a) { return a.parent === "c1"; });
    var live = kids.filter(function (a) { return g(a) !== "done" && g(a) !== "attn"; });
    var done = kids.filter(function (a) { return g(a) === "done"; });
    var order = { work: 0, off: 1, merge: 2 };
    live.sort(function (x, y) { return order[g(x)] - order[g(y)]; });
    html += '<div class="sec">' + h(c.title) + "</div>" + row(c);
    live.forEach(function (w) {
      html += row(w, "child");
      var subs = S.agents.filter(function (s) { return s.parent === w.id; });
      if (subs.length) {
        if (S.open["subs:" + w.id]) html += subs.map(function (s) { return row(s, "grand"); }).join("") + '<button class="morelink" data-act="subs" data-id="' + w.id + '">Hide helpers</button>';
        else html += '<button class="morelink" data-act="subs" data-id="' + w.id + '">' + subs.length + " helper agents · " + subs.filter(function (s) { return g(s) === "work"; }).length + " working</button>";
      }
    });
    if (!live.length && !att.length) html += '<div class="quiet-empty">Nothing running. Give the coordinator a goal.</div>';
    if (done.length) {
      html += '<div class="sec"><button data-act="toggle-done">' + (S.showDone ? "▾" : "▸") + " Done (" + done.length + ")</button></div>";
      if (S.showDone) html += done.map(function (a) { return row(a, "child"); }).join("");
    }
    var ext = S.agents.filter(function (a) { return a.kind === "external"; });
    html += '<div class="sec"><button data-act="toggle-ext">' + (S.showExt ? "▾" : "▸") + " Outside Fyx (" + ext.length + ")</button></div>";
    if (S.showExt) html += ext.map(function (a) { return row(a); }).join("");
    $("rows").innerHTML = html;
    $("stopbox").innerHTML = S.stopConfirm
      ? '<span class="stopconfirm">Stop all agents? <button class="danger" data-act="stop-yes">Stop</button><button data-act="stop-no">Cancel</button></span>'
      : S.stopped ? '<button class="stoplink" style="color:var(--fg)" data-act="resume">Resume all</button>' : '<button class="stoplink" data-act="stop">Stop all</button>';
  }

  function renderFoot() {
    var sp = spent(), pct = sp / S.cap;
    $("treefoot").innerHTML = '<span class="num ' + (pct >= .8 ? "warn" : "") + '">Today $' + sp.toFixed(2) + " of $" + S.cap + "</span>" + (S.pausedNew ? "<span>· new workers paused</span>" : "") + (S.queue.length ? '<span>·</span><button class="linkish" style="font-size:11.5px" data-act="tab" data-k="queue">' + S.queue.length + " merging</button>" : "");
  }

  function renderChat() {
    var m = $("msgs");
    m.innerHTML = S.chat.map(function (c) {
      if (c.from === "digest") {
        var d = c.digest, li = [];
        if (d.merged) li.push(d.merged + " merged");
        if (d.sentBack) li.push(d.sentBack + " failed a check and went back to its agent (handled)");
        if (d.needs) li.push(d.needs + " need you now");
        if (!li.length) li.push("Nothing changed");
        return '<div class="digest"><b>While you were away (since ' + h(d.since) + ')</b><ul>' + li.map(function (x) { return "<li>" + h(x) + "</li>"; }).join("") + '</ul><span class="sub">No notifications were sent while you were away; ' + d.total + " updates are summed up here.</span>" + (d.needs ? '<span><button class="linkish" data-act="next">Start with the first one</button></span>' : "") + "</div>";
      }
      if (c.from === "ref") {
        var done = c.link === "budget" ? S.budgetAsk && S.budgetAsk.answered : !(A(c.link) && g(A(c.link)) === "attn");
        return '<div class="msg ' + (done ? "" : "ref") + '"><div class="who">Coordinator</div><div class="txt">' + h(c.text) + (done ? ' <span style="color:var(--dim)">· handled</span>' : ' · <button class="linkish" data-act="row" data-id="' + c.link + '">Open</button>') + "</div></div>";
      }
      return '<div class="msg ' + (c.from === "me" ? "me" : "") + '"><div class="who">' + (c.from === "me" ? "You" : "Coordinator") + '</div><div class="txt">' + h(c.text) + "</div></div>";
    }).join("");
    m.scrollTop = m.scrollHeight;
  }

  function renderToasts() {
    var live = attention().map(function (a) { return a.id; });
    S.toasts = S.toasts.filter(function (x) { return x.title === "Prototype" || live.indexOf(x.agent) >= 0; });
    var t = S.toasts[S.toasts.length - 1];
    $("toasts").innerHTML = t ? '<div class="toast"><div class="tt">' + h(t.title) + '</div><div class="tb">' + h(t.body) + '</div><div class="act"><button class="btn primary" data-act="row" data-id="' + t.agent + '">Open</button><button class="btn quiet" data-act="dismiss">Later</button>' + (S.toasts.length > 1 ? '<span class="more">+' + (S.toasts.length - 1) + " more</span>" : "") + "</div></div>" : "";
  }
  function renderTerm() { var t = $("termlog"); t.innerHTML = S.log.map(function (l) { return '<div class="' + l[0] + '">' + h(l[1]) + "</div>"; }).join(""); t.scrollTop = t.scrollHeight; }
  function renderProto() {
    $("p-play").textContent = S.playing ? "❚❚ Pause events" : "▶ Play events"; $("p-play").classList.toggle("on", S.playing);
    $("p-away").textContent = S.away ? "I'm back (show summary)" : "Simulate: I'm away"; $("p-away").classList.toggle("on", S.away);
    $("p-step").textContent = "Next event (" + S.nextEvent + "/" + EVENTS.length + ")";
  }
  function render() { renderProto(); renderTitle(); renderTabs(); renderPane(); renderTree(); renderFoot(); renderChat(); renderToasts(); renderTerm(); }

  document.addEventListener("toggle", function (e) { var k = e.target.getAttribute && e.target.getAttribute("data-det"); if (k) S.open[k] = e.target.open; }, true);
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]"); if (!el) return;
    var act = el.getAttribute("data-act"), id = el.getAttribute("data-id"), i = +el.getAttribute("data-i");
    switch (act) {
      case "close": e.stopPropagation(); closeTab(el.getAttribute("data-k")); break;
      case "tab": S.tab = el.getAttribute("data-k"); if (S.tabs.indexOf(S.tab) < 0) S.tabs.push(S.tab); S.sel = S.tab.indexOf("card:") === 0 ? S.tab.slice(5) : null; break;
      case "row": openCard(id); S.toasts = S.toasts.filter(function (t) { return t.agent !== id; }); break;
      case "next": var f = attention()[0]; if (f) openCard(f.id); break;
      case "answer": answer(id, i); return;
      case "approve": approve(id); return;
      case "back": conflictBack(id); return;
      case "mine": conflictMine(id); return;
      case "pause": A(id).state = "paused"; break;
      case "resume1": A(id).state = "working"; A(id).now = "Resumed."; finishLater(id, 8000); break;
      case "stop1": A(id).state = "stopped"; A(id).now = "Stopped by you. Its folder stays as it is."; break;
      case "stop": S.stopConfirm = true; break;
      case "stop-no": S.stopConfirm = false; break;
      case "stop-yes": stopAll(); break;
      case "resume": resumeAll(); break;
      case "dismiss": S.toasts.pop(); break;
      case "subs": S.open["subs:" + id] = !S.open["subs:" + id]; break;
      case "toggle-done": S.showDone = !S.showDone; break;
      case "toggle-ext": S.showExt = !S.showExt; break;
      case "fake": S.toasts.push({ id: ++S.seq, title: "Prototype", body: el.getAttribute("data-msg"), agent: S.sel }); var sid = S.seq; later(function () { S.toasts = S.toasts.filter(function (x) { return x.id !== sid; }); render(); }, 2500); break;
      case "cm-open": A(id).hunks[i].comment = "open"; render(); var ta = document.getElementById("cm-" + id + i); if (ta) ta.focus(); return;
      case "cm-cancel": A(id).hunks[i].comment = null; break;
      case "cm-send":
        var box = document.getElementById("cm-" + id + i), txt = box ? box.value.trim() : ""; if (!txt) { if (box) box.focus(); return; }
        var a = A(id); a.hunks[i].comment = txt; a.state = "working"; a.now = "Working on your comment: " + txt;
        finishLater(id, 6000, "Addressed your comment. The checks pass."); break;
    }
    render();
  });
  document.addEventListener("keydown", function (e) {
    if (e.target.id === "goal" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendGoal(); }
    else if (e.key === "Enter" && e.target.classList && e.target.classList.contains("row")) { openCard(e.target.getAttribute("data-id")); render(); }
  });
  $("send").addEventListener("click", sendGoal);
  $("p-play").addEventListener("click", play);
  $("p-step").addEventListener("click", function () { S.playing = false; step(); });
  $("p-away").addEventListener("click", toggleAway);
  $("p-reset").addEventListener("click", function () { timers.forEach(clearTimeout); timers = []; S = fresh(); $("p-hint").textContent = "Reset. Press Play, then follow the yellow pill in the title bar."; render(); });

  S = fresh();
  render();
})();
</script>
