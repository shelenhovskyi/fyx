[package]
name = "fyx_demo_pseudo_terminal"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/fyx_demo_pseudo_terminal.rs"
crate-type = ["cdylib"]
test = true
doctest = false

[features]
# The demo needs the staged fyx:ui 0.4 world (`fyx-ui-0-4`); without it, a build for 0.1, 0.2 or
# 0.3 shows a panel that says so. The newest world wins when several are on.
fyx-ui-0-2 = []
fyx-ui-0-3 = ["ui_ext_sdk/fyx-ui-0-3"]
fyx-ui-0-4 = ["ui_ext_sdk/fyx-ui-0-4"]

[dependencies]
ui_ext_sdk.workspace = true
