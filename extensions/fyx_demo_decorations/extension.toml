id = "fyx-demo-decorations"
name = "TODO highlights demo"
description = "Fyx UI demo: editor decorations above TODO, FIXME and HACK comments (mocked worktree; needs fyx:ui 0.2)."
version = "0.1.0"
schema_version = 1
authors = ["Fyx"]

# Read by Fyx's extension host (`fyx_ui::UiManifest`); upstream ignores the table.
# `script/fyx-build-demos` builds the component and copies it here as `fyx_ui.wasm`;
# `script/fyx-build-demos --fyx-ui-0-2` builds the 0.2 component, which places the decorations.
[fyx_ui]
api_version = "0.1.0"
component = "fyx_ui.wasm"
capabilities = ["ui:panel", "ui:editor-decorations"]
