id = "fyx-gemini-cli"
name = "Gemini CLI"
description = "Runs Gemini CLI in Fyx's terminal as its IDE companion: your open files and selection as context, and Gemini's edits reviewed hunk by hunk in agent review (fyx:ui 0.4 only)."
version = "0.1.0"
schema_version = 1
authors = ["Fyx"]

# Plan 5.16, docs/fyx/wit-0.4/design.md "The first extensions". It follows Gemini CLI's documented
# IDE companion spec (docs/ide-integration/ide-companion-spec.md), checked against the CLI's
# source; the compat test pins Gemini CLI 0.69.0 (src/compat/README.md). It exists to show that
# the 0.4 kit is general: what this manifest cannot say yet is listed there as gaps.
[fyx_ui]
api_version = "0.4.0"
component = "fyx_ui.wasm"
capabilities = [
    "ui:panel",
    # The "Gemini CLI" entry in the terminal panel's "+" menu (T1).
    "terminal:profiles",
    # GEMINI_CLI_IDE_SERVER_PORT, which picks this window when several have the workspace (T2).
    "terminal:env",
    # The companion's MCP server over streamable HTTP (T2).
    "network:listen",
    # gemini-ide-server-<pid>-<port>.json, how the CLI finds that server (T2).
    "fs:discovery-file",
    # `openDiff` becomes a proposal in agent review (T1).
    "review:propose",
    # `ide/contextUpdate` from the open files and selection.
    "context:editor",
    # `${package}/gemini-settings/system-defaults.json` in GEMINI_CLI_SYSTEM_DEFAULTS_PATH (T0).
    "package:files",
    # The hooks of that settings file, through `fyx-relay` (T2).
    "relay:hooks",
    # The hooks' tool, waits and turns on the profile terminal's tab (T1).
    "terminal:status",
]

[[fyx_ui.terminal_profiles]]
id = "gemini"
name = "Gemini CLI"
icon = "sparkle"
program = "gemini"
cwd = "worktree"
# The user picks the account (GEMINI_CLI_HOME) for each terminal.
account_tool = "gemini"

# GEMINI_CLI_SYSTEM_DEFAULTS_PATH replaces the CLI's system defaults file (there is none by
# default); the user's and the project's settings still win over it, and their hooks run too.
[fyx_ui.terminal_env]
vars = { GEMINI_CLI_IDE_SERVER_PORT = "${listen.ide.port}", GEMINI_CLI_SYSTEM_DEFAULTS_PATH = "${package}/gemini-settings/system-defaults.json" }
scope = "profiles"
reason = "Tells Gemini CLI which Fyx window's IDE server to use, and loads Fyx's hooks."

# The CLI posts to http://127.0.0.1:<port>/mcp with `Authorization: Bearer <authToken>`.
[[fyx_ui.listeners]]
name = "ide"
protocol = "mcp-streamable-http"
auth = { bearer = true }
token_in_env = false
reason = "Lets Gemini CLI in your terminal read your open files and propose edits."

# The CLI wants {port: number, workspacePath: "<root>:<root>", authToken, ideInfo: {name,
# displayName}}; without ideInfo it refuses IDE mode outside the editors it knows. A whole
# "${port}" is written as a number, and "${worktrees.joined}" joins the roots with the OS path
# delimiter. The spec's POSIX dir, gemini-ide-<uid>, puts a placeholder inside a folder name,
# which the kit refuses. So this uses ${tmp}/gemini/ide, which the CLI reads on every OS (on
# Windows it is the spec's dir; on POSIX it is the CLI's fallback). See src/compat/README.md.
[[fyx_ui.discovery_files]]
listener = "ide"
dir = "${tmp}/gemini/ide"
name = "gemini-ide-server-${pid}-${port}.json"
reason = "Gemini CLI finds Fyx's IDE server through this file."

[fyx_ui.discovery_files.content]
port = "${port}"
workspacePath = "${worktrees.joined}"
authToken = "${token}"
ideInfo = { name = "fyx", displayName = "Fyx" }

# The hooks of gemini-settings/system-defaults.json (src/hooks.rs). Gemini runs them in a trusted
# folder only, in PowerShell on Windows and bash elsewhere, so each is `node -e` with the relay
# call. All of them only report, so they fail open fast.
[[fyx_ui.relay_channels]]
name = "session-start"
timeout_ms = 5000
on_failure = { exit = 0 }
reason = "Shows which Gemini session runs in the terminal."

[[fyx_ui.relay_channels]]
name = "before-agent"
timeout_ms = 5000
on_failure = { exit = 0 }
reason = "Starts an agent turn when you send Gemini a prompt."

[[fyx_ui.relay_channels]]
name = "before-tool"
timeout_ms = 5000
on_failure = { exit = 0 }
reason = "Shows on the tab which tool Gemini is running."

[[fyx_ui.relay_channels]]
name = "after-tool"
timeout_ms = 5000
on_failure = { exit = 0 }
reason = "Notes the files Gemini's write tools changed in the turn."

[[fyx_ui.relay_channels]]
name = "notification"
timeout_ms = 5000
on_failure = { exit = 0 }
reason = "Marks the tab when Gemini waits for you, with its message."

[[fyx_ui.relay_channels]]
name = "after-agent"
timeout_ms = 5000
on_failure = { exit = 0 }
reason = "Ends the agent turn when Gemini is done, with the files it changed."

[[fyx_ui.relay_channels]]
name = "session-end"
timeout_ms = 5000
on_failure = { exit = 0 }
reason = "Clears the tab when the Gemini session ends."
