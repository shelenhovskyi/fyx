id = "fyx-demo-gitstatus"
name = "Git status demo"
description = "Fyx UI demo: a git status panel with coloured rows and row details (mocked repository)."
version = "0.1.0"
schema_version = 1
authors = ["Fyx"]

# Read by Fyx's extension host (`fyx_ui::UiManifest`); upstream ignores the table.
# `script/fyx-build-demos` builds the component and copies it here as `fyx_ui.wasm`.
[fyx_ui]
api_version = "0.1.0"
component = "fyx_ui.wasm"
capabilities = ["ui:panel"]
