id = "fyx-demo-t2"
name = "T2 capabilities demo"
description = "Fyx UI demo: network:fetch, process:spawn, workspace:edit and agent:observe with their consent prompts (fyx:ui 0.3 only)."
version = "0.1.0"
schema_version = 1
authors = ["Fyx"]

# Read by Fyx's extension host (`fyx_ui::UiManifest`); upstream ignores the table.
# This demo exists only for the staged fyx:ui 0.3: `script/fyx-build-demos --fyx-ui-0-3` builds it
# into <target>/fyx-demos-v0_3/fyx_demo_t2/, and the default and 0.2 modes leave it out.
[fyx_ui]
api_version = "0.3.0"
component = "fyx_ui.wasm"
capabilities = ["ui:panel", "network:fetch", "process:spawn", "workspace:edit", "agent:observe"]

[fyx_ui.network]
domains = ["api.github.com"]

[[fyx_ui.processes]]
name = "git"
args = ["status", "--short"]
