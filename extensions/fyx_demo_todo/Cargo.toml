[package]
name = "fyx_demo_todo"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/fyx_demo_todo.rs"
crate-type = ["cdylib"]
test = true
doctest = false

[features]
# Export the fyx:ui 0.2 world, or the staged 0.3 world, instead of 0.1 (see the end of the
# crate root). 0.3 wins when both are on.
fyx-ui-0-2 = []
fyx-ui-0-3 = ["ui_ext_sdk/fyx-ui-0-3"]
fyx-ui-0-4 = ["fyx-ui-0-3", "ui_ext_sdk/fyx-ui-0-4"]

[dependencies]
ui_ext_sdk.workspace = true
