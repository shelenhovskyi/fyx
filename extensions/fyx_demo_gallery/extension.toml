id = "fyx-demo-gallery"
name = "Gallery demo"
description = "Fyx UI demo: every fyx:ui primitive in one panel, plus a status item."
version = "0.1.0"
schema_version = 1
authors = ["Fyx"]

# Read by Fyx's extension host (`fyx_ui::UiManifest`); upstream ignores the table.
# `script/fyx-build-demos` builds the component and copies it here as `fyx_ui.wasm`.
[fyx_ui]
api_version = "0.1.0"
component = "fyx_ui.wasm"
# `ui:modal` (the picker) and `ui:notifications` (Notify, Run job) are for the 0.2 build
# (`script/fyx-build-demos --fyx-ui-0-2`).
capabilities = ["ui:panel", "ui:status-bar", "ui:modal", "ui:notifications"]
